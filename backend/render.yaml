services:
  - type: web
    name: portfolio-backend
    env: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: TRUST_PROXY
        value: 1
      - key: MONGODB_URI
        sync: false
      - key: DB_NAME
        value: vivek_data
      - key: FRONTEND_URLS
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: PROJECT_ACCESS_SECRET
        sync: false
      - key: ADMIN_LOGIN_RATE_WINDOW_MS
        value: 900000
      - key: ADMIN_LOGIN_MAX_ATTEMPTS
        value: 8
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: CHATBOT_RATE_WINDOW_MS
        value: 60000
      - key: CHATBOT_MAX_REQUESTS_PER_WINDOW
        value: 8
      - key: CHATBOT_DAILY_LIMIT
        value: 80
      - key: CHATBOT_BODY_LIMIT
        value: 20kb
      - key: CHATBOT_MAX_MESSAGE_CHARS
        value: 500
      - key: CHATBOT_MAX_HISTORY_ITEMS
        value: 12
      - key: CHATBOT_MAX_HISTORY_CHARS
        value: 500
      - key: FEEDBACK_RATE_WINDOW_MS
        value: 600000
      - key: FEEDBACK_RATE_MAX_REQUESTS
        value: 20
      - key: FEEDBACK_BODY_LIMIT
        value: 10kb
      - key: PROJECT_PIN_RATE_WINDOW_MS
        value: 600000
      - key: PROJECT_PIN_MAX_ATTEMPTS
        value: 10
      - key: RECAPTCHA_SECRET_KEY
        sync: false
      - key: RECAPTCHA_MIN_SCORE
        value: 0.5
      - key: RECAPTCHA_BYPASS_IN_DEV
        value: false
